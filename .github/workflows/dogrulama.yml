# Portman · otomatik doğrulama (Kurulum Panosu satır 12; Araştırma yol haritası KT1).
#
# Her PR'da ve main'e her push'ta oturumların tam doğrulaması koşar: `bash araclar/ortam_kur.sh --dogrula`'nın 4. adımındaki
# komutların aynısı (Beyin harness'i 22 vaka, tam referans gerilemesi `testler/referans/dogrula.py`, bütün pytest'ler), dört
# paralel işe bölünmüş. Tek işte 21–37 dk sürüyordu (pytest tek çekirdekte 17–28 dk); bölününce en uzun iş ~10–12 dk.
# Ortam her işte `ortam_kur.sh` ile kurulur. `ortam_kur.sh --dogrula`'ya adım eklenirse burası da güncellenir.
# İki Python'da koşar: 3.11 (oturumların yerel ortamı, araclar/gereksinimler.txt) ve 3.12 (canlı sunucu 3.12.3; üstüne
# vps/gereksinimler.txt: numpy 2.5.4, vtk). 3.12'den beri sum() float'ları telafili toplar; sürüme bağlı farkı burada görürüz.
# Biri kırmızıysa PR'da kırmızı çarpı yanar; hangi iş, hangi test düştü koşu kaydında.
#
# Sınırlar:
# - Canlıya, LLM'e, WhatsApp'a bağlanmaz; sır kullanmaz (secrets yok, yalnız okuma izni).
# - Kaynaklı testler (PORTMAN_CELIK_KAYNAK, PORTMAN_PAFTA_DIZINI, PORTMAN_KOR_*: Drive'daki gerçek paftalar ve listeler)
#   burada atlanır; o dosyalar GitHub'a yüklenmez. Onlar oturumda kaynaklı koşuyla doğrulanır.
# - Oturumlardaki gibi root ile koşar (Postgres kümesini ayrı `pgtest` kullanıcısıyla kurar, kurulum testleri bunu ister).
name: Doğrulama

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Aynı PR'a yeni push gelince eski koşu durur (dakika boşa gitmez).
concurrency:
  group: dogrulama-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dogrula:
    name: ${{ matrix.ad }} · ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        parca: [referans, kalici, genel_motor, kalan]
        include:
          - parca: referans
            ad: harness + referans
          # Postgres'li kalıcı akış testleri; Postgres yoksa atlanmazlar, iş kırmızı olur.
          - parca: kalici
            ad: testler (kalıcı akış)
            yollar: testler/kalici
          - parca: genel_motor
            ad: testler (genel motor, motor)
            yollar: testler/genel testler/motor
          # Kalan her şey: yeni bir test klasörü eklenince kendiliğinden buraya düşer.
          - parca: kalan
            ad: testler (kalan)
            yollar: testler --ignore=testler/kalici --ignore=testler/genel --ignore=testler/motor
    steps:
      # Tam geçmiş: hakem ve mühür testleri git geçmişini okur, sığ klonda durur.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Sanal ortam önce bu Python'la açılır; ortam_kur.sh var olanı kullanır (yoksa python3.11'i arar).
      - name: Ortam (bash araclar/ortam_kur.sh)
        run: |
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          sudo env "PATH=$PATH" HOME=/root python -m venv /root/.cache/portman-venv
          sudo env "PATH=$PATH" HOME=/root bash araclar/ortam_kur.sh
          if [[ "${{ matrix.python }}" == 3.12 ]]; then
            sudo env "PATH=$PATH" HOME=/root /root/.cache/portman-venv/bin/python -m pip install -q -r vps/gereksinimler.txt
          fi
          sudo /root/.cache/portman-venv/bin/python -c "import sys, numpy; print('-- Python', sys.version.split()[0], '· numpy', numpy.__version__); sys.exit(sys.version_info[:2] != tuple(map(int, '${{ matrix.python }}'.split('.'))))"

      - name: ${{ matrix.ad }}
        env:
          YOLLAR: ${{ matrix.yollar }}
        run: |
          R() { sudo env "PATH=$PATH" HOME=/root TMPDIR="$RUNNER_TEMP" "$@"; }
          PY=/root/.cache/portman-venv/bin/python
          PG="host=127.0.0.1 port=55432 user=postgres"
          if [[ "${{ matrix.parca }}" == referans ]]; then
            # Referans harness'ten önce: dogrula.py ağacı geçici kopyada koşar, harness'in beyin/testler'e yazdıkları ona girmez.
            # "SONUÇ: referansla aynı" beklenir (çıkış 1 = fark, 2 = referans bozuk).
            R "$PY" testler/referans/dogrula.py
            R "$PY" -m beyin.harness | tail -1
          else
            if [[ "$YOLLAR" == testler/kalici ]]; then
              R "$PY" -c "import psycopg; psycopg.connect('$PG dbname=postgres', connect_timeout=10).close()" \
                || { echo "DUR: Postgres yok; kalıcı akış testleri atlanırdı"; exit 1; }
            fi
            # shellcheck disable=SC2086
            R PORTMAN_TEST_PG="$PG" "$PY" -m pytest -q -rfE -p no:cacheprovider $YOLLAR
          fi

      # Testler root ile koştu; işin sonundaki checkout temizliği .git/index'i okuyabilsin (yoksa sarı uyarı düşer).
      - name: Çalışma klasörünün sahipliği
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
